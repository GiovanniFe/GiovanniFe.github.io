<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius</title>
    <!-- Versionamento adicionado para quebrar o cache -->
    <link rel="stylesheet" href="css/style.css?v=1.0.0">
</head>
<body>
    <div id="screen-menu" class="screen">
        <h1>Genius</h1>
        <div class="menu-buttons">
            <button class="btn-progressivo" id="btn-classic">
                🎮 Clássico <span id="menu-rec-classic" class="menu-rec"></span>
            </button>
            <button class="btn-dark" id="btn-dark">
                🎧 In the Dark <span id="menu-rec-dark" class="menu-rec"></span>
            </button>
            <button class="btn-oneshade" id="btn-oneshade">
                ⚪ One Shade of Hue <span id="menu-rec-oneshade" class="menu-rec"></span>
            </button>
            <a href="../index.html" class="btn-quit" style="text-decoration: none; margin-top: 20px; display: flex;">⬅ Voltar ao Hub</a>
        </div>
    </div>

    <div id="screen-game" class="screen hidden">
        <div class="hud">
            <div id="hud-center">
                <span id="level-text">Nível: 1</span>
            </div>
        </div>

        <div class="grid" id="grid">
            <div class="genius-btn" id="btn-green" data-color="0"></div>
            <div class="genius-btn" id="btn-red" data-color="1"></div>
            <div class="genius-btn" id="btn-yellow" data-color="2"></div>
            <div class="genius-btn" id="btn-blue" data-color="3"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 50px;">
            <button class="btn-quit" id="btn-pause" style="margin-top: 0;">⏸ Pausar</button>
            <button class="btn-quit" id="btn-quit" style="margin-top: 0;">✖ Abandonar</button>
        </div>
    </div>

    <div id="screen-pause" class="screen hidden">
        <h2>Jogo Pausado</h2>
        <div class="menu-buttons">
            <button class="btn-progressivo" id="btn-resume">▶ Continuar</button>
            <button class="btn-quit" id="btn-quit-pause" style="margin-top: 20px;">✖ Abandonar Partida</button>
        </div>
    </div>

    <div id="screen-confirm" class="screen hidden">
        <h2>Sair da Partida?</h2>
        <p style="margin-bottom: 20px; text-align: center;">Seu progresso atual será perdido.</p>
        <div class="menu-buttons">
            <button class="btn-quit" id="btn-confirm-yes" style="margin-top: 0;">Sim, Abandonar</button>
            <button class="btn-progressivo" id="btn-confirm-no">Cancelar</button>
        </div>
    </div>

    <div id="screen-gameover" class="screen hidden">
        <h2>Fim de Jogo</h2>
        <p id="gameover-stats"></p>
        <button class="btn-progressivo" id="btn-back-menu">Voltar ao Menu</button>
    </div>

    <!-- Etiqueta visual de versão no canto da tela -->
    <div class="version-label">v. 1.0.0</div>

    <!-- Versionamento adicionado para quebrar o cache -->
    <script src="js/game.js?v=1.0.0"></script>
</body>
</html>
