<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HueSpot</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="screen-menu" class="screen">
        <h1 id="game-title"></h1>
        <div class="menu-buttons">
            <button class="btn-tutorial" onclick="startGame('tutorial')">
                🎓 Como Jogar
            </button>
            <button class="btn-survival" onclick="startGame('survival')">
                💀 Survival <span id="menu-rec-survival" class="menu-rec"></span>
            </button>
            <button class="btn-progressivo" onclick="startGame('progressivo')">
                ↗️ Progressivo <span id="menu-rec-progressivo" class="menu-rec"></span>
            </button>
            <button class="btn-pegadinha" onclick="startGame('pegadinha')">
                😆 Pegadinha <span id="menu-rec-pegadinha" class="menu-rec"></span>
            </button>

            <div class="zen-group">
                <span>Modo Zen:</span>
                <button class="btn-easy" onclick="startGame('zen', 40)">🍃 Fácil</button>
                <button class="btn-medium" onclick="startGame('zen', 20)">😊 Médio</button>
                <button class="btn-hard" onclick="startGame('zen', 5)">😅 Difícil</button>
            </div>
            <a href="../" class="btn-quit" style="text-decoration: none; margin-top: 20px; display: flex;">⬅ Voltar ao Hub</a>
        </div>
    </div>

    <div id="screen-game" class="screen hidden">
        <div class="hud">
            <div id="hud-left"></div>
            <div id="hud-center" class="timer-container">
                <span id="timer-text"></span>
                <span id="time-anim" class="time-anim"></span>
            </div>
            <div id="hud-right"></div>
        </div>

        <div class="grid" id="grid">
            <div class="square-div">
                <div class="rgb-card hidden">
                    <div class="rgb-title">Composição da Cor</div>
                    <div class="rgb-row"><span class="rgb-label">R</span><div class="rgb-bar-bg"><div class="rgb-bar red"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">G</span><div class="rgb-bar-bg"><div class="rgb-bar green"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">B</span><div class="rgb-bar-bg"><div class="rgb-bar blue"></div></div><span class="rgb-val">0</span></div>
                </div>
            </div>
            <div class="square-div">
                <div class="rgb-card hidden">
                    <div class="rgb-title">Composição da Cor</div>
                    <div class="rgb-row"><span class="rgb-label">R</span><div class="rgb-bar-bg"><div class="rgb-bar red"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">G</span><div class="rgb-bar-bg"><div class="rgb-bar green"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">B</span><div class="rgb-bar-bg"><div class="rgb-bar blue"></div></div><span class="rgb-val">0</span></div>
                </div>
            </div>
            <div class="square-div">
                <div class="rgb-card hidden">
                    <div class="rgb-title">Composição da Cor</div>
                    <div class="rgb-row"><span class="rgb-label">R</span><div class="rgb-bar-bg"><div class="rgb-bar red"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">G</span><div class="rgb-bar-bg"><div class="rgb-bar green"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">B</span><div class="rgb-bar-bg"><div class="rgb-bar blue"></div></div><span class="rgb-val">0</span></div>
                </div>
            </div>
            <div class="square-div">
                <div class="rgb-card hidden">
                    <div class="rgb-title">Composição da Cor</div>
                    <div class="rgb-row"><span class="rgb-label">R</span><div class="rgb-bar-bg"><div class="rgb-bar red"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">G</span><div class="rgb-bar-bg"><div class="rgb-bar green"></div></div><span class="rgb-val">0</span></div>
                    <div class="rgb-row"><span class="rgb-label">B</span><div class="rgb-bar-bg"><div class="rgb-bar blue"></div></div><span class="rgb-val">0</span></div>
                </div>
            </div>
        </div>

        <button id="btn-trick" class="hidden" onclick="handleTrickButtonClick()">Pegadinha!</button>

        <div class="game-buttons-group">
            <button class="btn-restart hidden" id="btn-restart" onclick="restartGame()">🔄 Reiniciar Partida</button>
            <button class="btn-quit" id="btn-quit-game" onclick="requestQuit()">✖ Abandonar</button>
        </div>
    </div>

    <div id="screen-confirm" class="screen hidden">
        <h2>Sair da Partida?</h2>
        <p style="margin-bottom: 20px; text-align: center;">Seu progresso atual será perdido.</p>
        <div class="menu-buttons">
            <button class="btn-quit" style="margin-top: 0;" onclick="confirmQuit()">Sim, Abandonar</button>
            <button class="btn-progressivo" onclick="cancelQuit()">Cancelar</button>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="modal-title">Modo</h2>
            <p id="modal-text"></p>
            <div class="dont-show-container">
                <input type="checkbox" id="chk-dont-show">
                <label for="chk-dont-show">Não mostrar novamente</label>
            </div>
            <button class="btn-modal" onclick="closeModalAndInit()">Entendi! Começar</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
